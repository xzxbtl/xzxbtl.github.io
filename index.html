<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPosting Manager</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", sans-serif;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            max-width: 540px;
            width: 90%;
            padding: 40px 20px;
            background: #151515;
            border-radius: 22px;
            box-shadow: 0 0 25px rgba(0,0,0,0.4);
            animation: fade 0.7s ease;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
        }

        p.desc {
            margin-bottom: 35px;
            opacity: 0.8;
            font-size: 15px;
        }

        .btn-block {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            color: white;
            transition: 0.25s;
        }

        .video {
            background: linear-gradient(135deg, #cf3cff, #7f23ff);
        }

        .posts {
            background: linear-gradient(135deg, #1da1f2, #0088cc);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        footer {
            margin-top: 28px;
            font-size: 13px;
            opacity: 0.5;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>AutoPosting Manager</h1>
    <p class="desc">
        Управляйте шаблонами видео и постов прямо из браузера.
        Выберите нужный раздел ниже:
    </p>

    <div class="btn-block">
        <a href="./video_templates.html" class="btn video">🎥 Видео-шаблоны</a>
        <a href="./posts_templates.html" class="btn posts">💬 Посты-шаблоны</a>
    </div>

    <footer>
        © 2025 xzxbtl — AutoPostingManager
    </footer>
</div>

</body>
</html>
